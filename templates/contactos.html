{% extends 'base.html' %}
{% load static %}
{% block title %}Contactos | Guerrero Valiente{% endblock %}
{% block content %}
<section class="service-sec inner-page"><div class="container"><div class="row"><div class="col-md-12"><div class="heading text-md-center text-xs-center"><h2><small>ESTAMOS PARA ESCUCHARTE</small>Comunícate con Guerrero Valiente</h2></div></div></div><div class="inner-page-content"><p>¿Quieres conocer más sobre nuestro grupo? Escríbenos; te recibiremos con respeto y comprensión.</p><form class="contact-form" method="post" action="#"><div class="form-group"><label for="nombre">Tu nombre (opcional)</label><input type="text" class="form-control" id="nombre" name="nombre" autocomplete="name"></div><div class="form-group"><label for="telefono">Teléfono (opcional)</label><input type="tel" class="form-control" id="telefono" name="telefono" autocomplete="tel"></div><div class="form-group"><label for="email">Correo electrónico</label><input type="email" class="form-control" id="email" name="email" autocomplete="email" required></div><div class="form-group"><label for="mensaje">¿En qué podemos acompañarte?</label><textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="Puedes contarnos lo que necesites compartir."></textarea></div><button type="submit" class="btn btn-capsul btn-aqua">Enviar mensaje</button></form></div></div></section>
{% endblock %}
